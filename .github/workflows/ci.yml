name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ověření statického vstupu
        run: |
          test -f index.html
          test -d rovnoramenne_vahy/assets
          test -f rovnoramenne_vahy/assets/jablko.svg

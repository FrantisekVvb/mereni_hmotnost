name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ověření statického vstupu
        run: |
          test -f index.html
          test -d assets
          test -f assets/jablko.svg
          test -f assets/fonts/FenomenSans-Book.woff2
